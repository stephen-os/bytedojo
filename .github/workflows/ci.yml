name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: pip install black flake8
      - name: black --check
        run: black --check src tests scripts
      - name: flake8
        run: flake8 src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    # Advisory until annotations are clean (§13) — flip to hard-fail then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy + deps
        run: pip install mypy click
      - name: mypy (advisory)
        run: mypy src/bytedojo

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e .[dev]
      - name: pytest with coverage gate
        run: pytest --cov=bytedojo --cov-fail-under=90
