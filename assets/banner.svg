<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <defs>
    <!-- Subtle glow for mountain lines -->
    <filter id="mountainGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="1280" height="320" fill="#0d1117"/>

  <!-- Centered container for logo + text -->
  <g transform="translate(271, 160)">
    <!-- Mountain logo (scaled to fit banner height) -->
    <g transform="scale(0.5) translate(-256, -256)" filter="url(#mountainGlow)">
      <g stroke-width="5" stroke-linejoin="round">
        <!-- Back triangle (largest, shifted right) -->
        <polygon points="269,80 433,380 105,380" fill="#0d1117" stroke="#6a2a8a"/>
        <!-- Middle triangle (shifted left) -->
        <polygon points="204,140 328,380 80,380" fill="#0d1117" stroke="#c43a3a"/>
        <!-- Front triangle (smallest, centered) -->
        <polygon points="256,200 340,380 172,380" fill="#0d1117" stroke="#f06060"/>
      </g>
    </g>

    <!-- BYTEDOJO text -->
    <text x="95" y="45"
          font-family="'Arial Black', 'Impact', sans-serif"
          font-size="115"
          font-weight="900"
          letter-spacing="5"
          fill="#ffffff">BYTEDOJO</text>
  </g>
</svg>
